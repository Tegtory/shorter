[project]
name = "shorter"
version = "0.1.0"
description = "Link shorter application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.22.0",
    "alembic>=1.16.5",
    "dishka>=1.6.0",
    "fastapi>=0.116.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "coverage>=7.10.5",
    "httpx>=0.28.1",
    "mypy>=1.17.1",
    "pre-commit>=4.3.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.10",
]


[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict_equality = true
ignore_missing_imports = true
show_error_codes = true
warn_unreachable = true


[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]

line-length = 79
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "E",
    "T",
    "T201",
    "W",
    "B",
    "ERA",
    "ASYNC",
    "FBT",
    "A",
    "INP",
    "SIM",
    "TD",
    "C90",
    "N",
    "PL",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "FURB",
]
ignore = []

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false

line-ending = "auto"

docstring-code-format = false

docstring-code-line-length = "dynamic"

[tool.coverage.run]
branch = true
omit = ["tests/*"]


[tool.coverage.report]
exclude_also = ["raise AssertionError", "raise NotImplementedError"]
