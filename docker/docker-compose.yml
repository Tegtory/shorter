services:
  shorter_app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    command: >
      sh -c "uv run alembic upgrade head && uv run python -m shorter"
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db_shorter_app
  db_shorter_app:
     image: postgres:16
     container_name: db_shorter_app
     volumes:
       - db_shorter_app:/var/lib/postgresql/data/
     environment:
       - POSTGRES_DB=${DB_NAME}
       - POSTGRES_USER=${DB_USER}
       - POSTGRES_PASSWORD=${DB_PASSWORD}
   
volumes:
  db_shorter_app: